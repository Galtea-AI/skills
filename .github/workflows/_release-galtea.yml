name: "🚀 Release | Release the galtea skill (reusable)"

# Building block called by merge-main.yml. If changelog entries were added
# since the last `galtea--v*` tag, it tags the pushed commit with the next
# version and creates the GitHub release with the entries as its notes. Any
# major entry makes it major, else patch. Releases nothing when no entry was
# added, or for a commit already tagged or older than the last release.
# Always runs when called.
on:
  workflow_call:
    inputs:
      sha:
        description: "The pushed commit to tag"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # creates the tag and the release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: .github/scripts/release-galtea/release-galtea.sh "$SHA"
